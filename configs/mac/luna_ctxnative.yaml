# Compaction-window sweep: GPT-6 luna, terminus-2, window = native.
#
# terminus-2 summarizes (compacts) when free tokens < proactive_summarization_threshold,
# with free = model context limit (922,000 for gpt-6-luna) - current prompt tokens.
# threshold = 922,000 - window  ->  native window (922,000); compact only near the limit.
#
# Run all four windows with:  bash scripts/run_sweep.sh configs/sweep/luna_ctx*.yaml

job_name: lhtb-luna-ctxnative
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 1   # jobs run two at a time -> 2 sandboxes at once
timeout_multiplier: 1.0

environment:
  type: daytona
  force_build: false
  delete: true                    # tear down each sandbox after its trial
  kwargs:
    auto_stop_interval_mins: 240  # crash safety net (> 3h agent budget + verifier)
    auto_delete_interval_mins: 30

agents:
  - name: terminus-2
    model_name: openai/gpt-6-luna
    override_timeout_sec: 10800
    kwargs:
      parser_name: json
      enable_summarize: true
      proactive_summarization_threshold: 8000
      record_terminal_session: true
      llm_call_kwargs:
        # LiteLLM reads OPENAI_API_KEY from the environment.
        max_tokens: 32768
        num_retries: 6

datasets:
  - path: ./LHTB/tasks
    task_names:
      # games
      - "2048"
      - chess-mate
      - sokoban
      # systems-engineering
      - spot-scheduler-traces
      - vector-db-iterative-build
      - duckdb-optimizer-closure
      # tool-use (APEX)
      - apex-ib244-matter
      - apex-investment-banking-matter
      - apex-law433-matter
