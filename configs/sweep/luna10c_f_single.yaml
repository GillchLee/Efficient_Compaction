# run: bash scripts/run_job.sh /home/lss/1_project/Efficient_Compaction/configs/sweep/luna10c_f_single.yaml
job_name: luna10c_f_single
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 3
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 7200
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    optlimit:
      mode: formula
      prior: terminus2-gpt-6-luna-single
      lookahead: 1
      prices: gpt-6-luna
      g_prior_weight: 0
      learn_lp: true
      learn_summary_out: true
      learn_gamma: true
    handoff:
      mode: single
      summary_words: 800
datasets:
- path: ./LHTB/tasks
  task_names:
  - spot-scheduler-traces
  - apex-ib244-matter
  - apex-law433-matter
