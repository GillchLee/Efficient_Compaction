# generated by configs/make_config.py: model=openai/gpt-6-luna condition=formula_terminus2-gpt-6-luna env=docker benchmark=custom budget=3.0h tasks=['build-cython-ext'] reasoning_effort=low
# run: bash scripts/run_job.sh configs/sweep/t2_diag_carry.yaml
job_name: t2_diag_carry
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: false
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    reasoning_effort: low
    optlimit:
      mode: formula
      prior: terminus2-gpt-6-luna
      lookahead: 1
      prices: gpt-6-luna
      limit_max: 12000
      carry_files: 4000
datasets:
- path: ./data/tb21_src/terminal-bench-2-1
  task_names:
  - build-cython-ext
