# generated by configs/make_config.py: model=openai/gpt-6-luna condition=l80k env=docker benchmark=swe_marathon budget=10.0h tasks=['nextjs-vite-rewrite'] reasoning_effort=medium
# env: HB_CONTINUE_MODE=
# harbor: 0.25
# run: bash scripts/run_job.sh configs/sweep/luna_swem_t2_l80k_nextjs.yaml
job_name: luna_swem_t2_l80k_nextjs
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 36000
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    reasoning_effort: medium
    optlimit:
      mode: fixed
      fixed_limit: 80000
      lookahead: 0
datasets:
- path: ./data/swe-marathon/tasks
  task_names:
  - nextjs-vite-rewrite
