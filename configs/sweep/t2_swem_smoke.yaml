# generated by configs/make_config.py: model=openai/gpt-6-luna condition=formula_terminus2-gpt-6-luna env=docker benchmark=swe_marathon budget=0.25h tasks=['zstd-decoder'] reasoning_effort=medium
# env: HB_CONTINUE_MODE=
# harbor: 0.25
# run: bash scripts/run_job.sh configs/sweep/t2_swem_smoke.yaml
job_name: t2_swem_smoke
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 900
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    reasoning_effort: medium
    optlimit:
      mode: formula
      prior: terminus2-gpt-6-luna
      lookahead: 1
      prices: gpt-6-luna
      limit_max: 16000
      carry_files: 2000
      carry_whole: 8000
      learn_lp: true
      learn_summary_out: true
      learn_gamma: true
datasets:
- path: ./data/swe-marathon/tasks
  task_names:
  - zstd-decoder
