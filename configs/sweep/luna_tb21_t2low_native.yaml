# generated by configs/make_config.py: model=openai/gpt-6-luna condition=native env=docker benchmark=custom budget=3.0h tasks=all reasoning_effort=low
# run: bash scripts/run_job.sh configs/sweep/luna_tb21_t2low_native.yaml
job_name: luna_tb21_t2low_native
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: false
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    reasoning_effort: low
    optlimit:
      mode: 'off'
datasets:
- path: ./data/tb21_src/terminal-bench-2-1
