    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 16384
      num_retries: 6
    optlimit:
      mode: fixed
      fixed_limit: 80000
      lookahead: 0
datasets:
- path: ./data/tb4
