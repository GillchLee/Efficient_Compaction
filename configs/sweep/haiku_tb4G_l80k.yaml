job_name: haiku_tb4G_l80k
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 2
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
