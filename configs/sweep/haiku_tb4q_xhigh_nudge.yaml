# generated by configs/make_config.py: model=anthropic/claude-haiku-5-5 condition=formula_terminus2-claude-haiku-5-5 env=docker budget=1.0h tasks=['pretrain-shard-corruption', 'coq-block-bound'] reasoning_effort=xhigh
# env: HB_IDLE_NUDGE=3
# run: bash scripts/run_job.sh configs/sweep/haiku_tb4q_xhigh_nudge.yaml
job_name: haiku_tb4q_xhigh_nudge
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 2
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: anthropic/claude-haiku-5-5
  override_timeout_sec: 3600
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 16384
      num_retries: 6
    reasoning_effort: xhigh
    optlimit:
      mode: formula
      prior: terminus2-claude-haiku-5-5
      lookahead: 1
      prices: claude-haiku-5-5
      g_prior_weight: 0
      learn_lp: true
      learn_summary_out: true
      learn_gamma: true
datasets:
- path: ./data/tb4
  task_names:
  - pretrain-shard-corruption
  - coq-block-bound
