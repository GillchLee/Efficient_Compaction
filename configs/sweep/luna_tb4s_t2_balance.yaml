# run: bash scripts/run_job.sh configs/sweep/luna_tb4s_t2_balance.yaml
job_name: luna_tb4s_t2_balance
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 4
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: false   # keep images between trials (harbor default --rmi all forced re-pulls; Hub pulls flaked 2026-11-12)
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 28800
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    optlimit:
      mode: balance
      prior: terminus2-gpt-6-luna
      lookahead: 1
      prices: gpt-6-luna
datasets:
- path: ./data/tb4_single
  task_names:
  - atrx-vep-crispr
  - biped-contact-dynamics
  - cad-model
  - data-anonymization
  - fin-saccr-rwa
  - formal-crypto
  - freecad-platform-drawing
