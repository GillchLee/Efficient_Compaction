# generated by configs/make_config.py: model=openai/gpt-6-luna condition=formula_terminus2-gpt-6-luna env=docker budget=2.0h tasks=['spot-scheduler-traces', 'apex-ib244-matter', 'apex-law433-matter']
# run: bash scripts/run_job.sh configs/sweep/luna10c_f_stock.yaml
job_name: luna10c_f_stock
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 3
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 7200
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    optlimit:
      mode: formula
      prior: terminus2-gpt-6-luna
      lookahead: 1
      prices: gpt-6-luna
      g_prior_weight: 0
      learn_lp: true
      learn_summary_out: true
      learn_gamma: true
datasets:
- path: ./LHTB/tasks
  task_names:
  - spot-scheduler-traces
  - apex-ib244-matter
  - apex-law433-matter
