# Claude (Anthropic API) on three long-running LHTB categories, same-conversation
# continuation, with per-turn prompt / cache-read / cache-write logging.
#
# Run via the wrapper (sets HB_CONTINUE_MODE=same_conversation and checks prereqs):
#
#   export ANTHROPIC_API_KEY=sk-ant-...         # YOUR key — never commit it
#   bash scripts/run_claude_long3.sh
#
# Per-turn token table afterwards:
#
#   python scripts/token_turns.py jobs/lhtb-claude-long3
#
# Categories (task.toml metadata.category), chosen for long native budgets and
# many interaction turns:
#   games          — 2048, chess-mate, sokoban          (native 4h, turn-by-turn play)
#   systems-eng    — spot-scheduler-traces, vector-db-iterative-build,
#                    duckdb-optimizer-closure           (native 3–6h, iterative builds)
#   tool-use/APEX  — apex-ib244-matter, apex-investment-banking-matter,
#                    apex-law433-matter                 (native 4–5h, document-heavy)

job_name: lhtb-claude-long3
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 3   # 32GB Mac: ~3 amd64 containers at once; lower if Docker OOMs
timeout_multiplier: 1.0

environment:
  type: docker
  force_build: false
  delete: true

agents:
  - name: terminus-2
    model_name: anthropic/claude-sonnet-5-5
    # Uniform 3h budget, same as the LHTB 2.0 leaderboard runs.
    override_timeout_sec: 10800
    kwargs:
      parser_name: json
      temperature: 1
      enable_summarize: true
      # Free-token floor before summarizing. With a 1M context the prompt can grow
      # to ~1M tokens; raise this (e.g. 800000) to cap context at ~200k.
      proactive_summarization_threshold: 8000
      record_terminal_session: true
      llm_call_kwargs:
        # Harbor / LiteLLM read ANTHROPIC_API_KEY from the environment.
        temperature: 1
        max_tokens: 8192
        num_retries: 4

datasets:
  - path: ./tasks
    task_names:
      # games
      - "2048"
      - chess-mate
      - sokoban
      # systems-engineering
      - spot-scheduler-traces
      - vector-db-iterative-build
      - duckdb-optimizer-closure
      # tool-use (APEX)
      - apex-ib244-matter
      - apex-investment-banking-matter
      - apex-law433-matter
