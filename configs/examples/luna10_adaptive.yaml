# generated by configs/make_config.py: model=openai/gpt-6-luna condition=formula_terminus2-gpt-6-luna env=docker budget=3.0h tasks=['spot-scheduler-traces', 'apex-ib244-matter']
# run: bash scripts/run_job.sh configs/examples/luna10_adaptive.yaml
job_name: luna10_adaptive_demo
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 2
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 10800
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 32768
      num_retries: 6
    optlimit:
      mode: formula
      prior: terminus2-gpt-6-luna
      lookahead: 1
      prices: gpt-6-luna
      g_prior_weight: 0
      learn_lp: true
      learn_summary_out: true
      learn_gamma: true
      prices_reload: true
      reacq_turns: 1.4     # measured re-acquisition turns per compaction (docs/floor_and_handoff_design.md)
      reacq_eps: 0.1       # floor: K >= reacq_turns / reacq_eps -> L_min ~ 23K for Luna
datasets:
- path: ./LHTB/tasks
  task_names:
  - spot-scheduler-traces
  - apex-ib244-matter
