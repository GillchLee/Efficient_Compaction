# generated by configs/make_config.py: model=openai/gpt-6-luna condition=l8k env=docker budget=0.15h tasks=['seismo_cross_correlation_lag__01'] handoff=mode=single,summary_words=500
# run: bash scripts/run_job.sh configs/smoke/luna_single_seismo_9min.yaml
job_name: smoke_luna_single
jobs_dir: ./jobs
n_attempts: 1
n_concurrent_trials: 1
timeout_multiplier: 1.0
environment:
  type: docker
  force_build: false
  delete: true
agents:
- import_path: optlimit.harbor_agent:OptlimitTerminus2
  model_name: openai/gpt-6-luna
  override_timeout_sec: 540
  kwargs:
    parser_name: json
    enable_summarize: true
    proactive_summarization_threshold: 8000
    record_terminal_session: true
    llm_call_kwargs:
      max_tokens: 16384
      num_retries: 6
    optlimit:
      mode: fixed
      fixed_limit: 8000
      lookahead: 0
    handoff:
      mode: single
      summary_words: 500
datasets:
- path: ./LHTB/tasks-2.0
  task_names:
  - seismo_cross_correlation_lag__01
