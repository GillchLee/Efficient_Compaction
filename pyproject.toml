[project]
name = "optlimit"
version = "0.1.0"
description = "Cost-optimal compaction threshold for terminus-2 on LHTB: cost model, online g estimator, in-process trigger (harbor_agent) and a harness-agnostic proxy"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
    "httpx>=0.27",
    "starlette>=0.37",
    "uvicorn>=0.29",
]

[project.scripts]
optlimit = "optlimit.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optlimit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
