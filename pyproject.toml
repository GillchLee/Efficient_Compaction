[project]
name = "optlimit"
version = "0.1.0"
description = "Cost-optimal compaction threshold for terminus-2 on LHTB: cost model, online g estimator, in-process trigger (harbor_agent)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6",
]

[project.optional-dependencies]
# optlimit.serve / optlimit.proxy: drive Claude Code / Codex compaction (docs/other_harnesses.md)
proxy = ["httpx>=0.27", "starlette>=0.37", "uvicorn>=0.29"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["optlimit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
